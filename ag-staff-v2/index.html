<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AG-ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal2.css">
</head>
<body>
<!-- 職員用ポータル 第2版。中身は js/portal-data.js(暗号化済み)を js/portal2.js が復号して表示する。 -->
<div id="gate" class="gate">
  <form id="gate-form" autocomplete="off">
    <pre class="banner">AG-ARCHIVE
STAFF TERMINAL / ACCESS LEVEL 4</pre>
    <p class="line">&gt; 認証が必要です。</p>
    <div class="prompt"><label for="pw">auth:</label><input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="submit">認証</button></div>
    <div id="gate-log" class="log" role="status"></div>
    
  </form>
</div>
<div id="app" hidden></div>
<div class="scan" aria-hidden="true"></div>
<script src="js/portal-data.js"></script>
<script src="js/portal2.js"></script>
</body>
</html>
